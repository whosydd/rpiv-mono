name: Sync upstream

on:
  schedule:
    # Poll for new upstream releases. GitHub Actions cannot subscribe to another
    # repository's release events, so a release-gated poll (cron, UTC) is how
    # "sync on each release" is implemented without upstream cooperation.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Rebase onto latest upstream release
        env:
          UPSTREAM_URL: https://github.com/juicesharp/rpiv-mono.git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream main --tags

          # Only rebase when upstream has cut a release (tag matching `v*`) that the
          # fork does not yet contain. Daily upstream commits are ignored, so the
          # fork only churns on actual releases instead of every push to upstream/main.
          LATEST_TAG="$(git describe --tags --abbrev=0 --match 'v*' upstream/main 2>/dev/null || true)"
          if [ -z "$LATEST_TAG" ]; then
            echo "No upstream release tag reachable from upstream/main; nothing to sync."
            exit 0
          fi
          if git merge-base --is-ancestor "$LATEST_TAG" HEAD; then
            echo "Fork main already contains upstream release $LATEST_TAG."
            exit 0
          fi

          echo "New upstream release $LATEST_TAG detected; rebasing onto it."
          git rebase "$LATEST_TAG"
          git push --force-with-lease origin HEAD:main
