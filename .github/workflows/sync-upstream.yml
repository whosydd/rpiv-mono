name: Sync upstream

on:
  schedule:
    # GitHub Actions cron expressions use UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        env:
          UPSTREAM_URL: https://github.com/juicesharp/rpiv-mono.git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork main already contains upstream/main."
            exit 0
          fi

          git merge --no-edit upstream/main
          git push origin HEAD:main
